[workspace]
resolver = "2"
members = [
    "crates/host",
    "crates/gfx",
    "crates/canvas2d",
    "crates/pak",
    "crates/net",
    "crates/audio",
    "crates/steam",
    "crates/video",
]

[workspace.package]
version = "0.1.0-alpha.10"
edition = "2021"
license = "MIT"
repository = "https://github.com/beemdvp/kaplay-native"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
cpal = "0.18"
dirs = "6"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
fontdb = "0.24"
glow = "0.18"
glutin = "0.32"
glutin-winit = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
libloading = "0.8"
log = "0.4"
opus-pure = "0.2"
polling = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
symphonia = { version = "0.6", default-features = false, features = [
    "opt-simd",
    "flac",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
    "mp3",
    "isomp4",
    "aac",
] }
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3", features = ["gzip"] }
png = "0.18"
ring = "0.17"
rusty_h264-common = "0.16"
rusty_h264-decoder = "0.16"
rquickjs = { version = "0.14", default-features = false, features = ["std", "array-buffer", "loader"] }
v8 = { version = "=152.2.0" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiny-skia = "0.12"
ttf-parser = "0.25"
winit = { version = "0.30", features = ["x11", "wayland"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
