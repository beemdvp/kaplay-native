[package]
name = "kaplay-native-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "kaplay-native-host"
path = "src/main.rs"

[features]
default = ["quickjs"]
quickjs = ["dep:rquickjs"]
v8 = ["dep:v8"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
dirs.workspace = true
env_logger.workspace = true
gilrs.workspace = true
glow.workspace = true
glutin.workspace = true
glutin-winit.workspace = true
image.workspace = true
log.workspace = true
png.workspace = true
ring.workspace = true
rustls.workspace = true
rquickjs = { workspace = true, optional = true }
v8 = { workspace = true, optional = true }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
winit.workspace = true
zip.workspace = true

kaplay-native-steam = { path = "../steam" }
kaplay-native-audio = { path = "../audio" }
kaplay-native-video = { path = "../video" }
kaplay-native-net = { path = "../net" }
kaplay-native-canvas2d = { path = "../canvas2d" }
kaplay-native-gfx = { path = "../gfx" }
kaplay-native-pak = { path = "../pak" }
