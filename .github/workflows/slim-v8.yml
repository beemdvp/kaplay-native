name: Slim V8

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/slim-v8.yml
      - scripts/build-slim-v8.sh

permissions:
  contents: write

jobs:
  archive:
    name: Slim V8 (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib: librusty_v8.a
            lib_ext: .a
            exe: ""
            host: target/release/kaplay-native-host
            smoke: true
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            lib: librusty_v8.a
            lib_ext: .a
            exe: ""
            host: target/release/kaplay-native-host
            smoke: true
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            lib: librusty_v8.a
            lib_ext: .a
            exe: ""
            host: target/release/kaplay-native-host
            smoke: true
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            lib: librusty_v8.a
            lib_ext: .a
            exe: ""
            host: target/x86_64-apple-darwin/release/kaplay-native-host
            smoke: false
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            lib: rusty_v8.lib
            lib_ext: .lib
            exe: .exe
            host: target/release/kaplay-native-host.exe
            smoke: true
    steps:
      - uses: actions/checkout@v4
      - name: Hash the build script
        id: config
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            hash=$(sha256sum scripts/build-slim-v8.sh | cut -d' ' -f1)
          elif command -v shasum >/dev/null 2>&1; then
            hash=$(shasum -a 256 scripts/build-slim-v8.sh | cut -d' ' -f1)
          else
            hash=$(openssl dgst -sha256 scripts/build-slim-v8.sh | awk '{print $NF}')
          fi
          echo "SLIM_V8_CONFIG=$hash" >> "$GITHUB_ENV"
      - name: Check the published archive
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^name = "v8"$/{getline; print $2; exit}' Cargo.lock)
          asset=librusty_v8_slim_${version}_${{ matrix.target }}${{ matrix.lib_ext }}
          notes=$(gh release view "slim-v8-$version" --json body -q .body 2>/dev/null || true)
          if printf '%s' "$notes" | grep -qF "config=$SLIM_V8_CONFIG" &&
            gh release view "slim-v8-$version" --json assets -q '.assets[].name' 2>/dev/null | grep -qxF "$asset"; then
            echo "$asset is already published for config $SLIM_V8_CONFIG" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.skip != 'true'
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
      - name: Install native dependencies
        if: steps.check.outputs.skip != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev libxkbcommon-x11-0 \
            xvfb unzip zstd lld
      - name: Install the Mesa software renderer
        if: steps.check.outputs.skip != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z -OutFile mesa.7z
          7z x mesa.7z -omesa
          Copy-Item mesa/x64/*.dll .
      - name: Restore the toolchain cache
        if: steps.check.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/kaplay-native
          key: slim-v8-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-slim-v8.sh') }}
      - name: Restore the slim archive
        if: steps.check.outputs.skip != 'true'
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: target/slim-v8
          key: slim-v8-${{ hashFiles('Cargo.lock', 'scripts/build-slim-v8.sh') }}-${{ matrix.target }}
      - name: Build the slim archive and host
        if: steps.check.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true'
        id: build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/build-slim-v8.sh
      - name: Save the slim archive
        if: ${{ !cancelled() && steps.check.outputs.skip != 'true' && steps.cache.outputs.cache-hit != 'true' && hashFiles('target/slim-v8/**') != '' }}
        uses: actions/cache/save@v4
        with:
          path: target/slim-v8
          key: slim-v8-${{ hashFiles('Cargo.lock', 'scripts/build-slim-v8.sh') }}-${{ matrix.target }}
      - name: Smoke the slim host against QuickJS
        if: steps.check.outputs.skip != 'true' && matrix.smoke
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          slim="${{ matrix.host }}"
          if [ ! -x "$slim" ]; then
            RUSTY_V8_ARCHIVE="$PWD/target/slim-v8/${{ matrix.lib }}" \
              cargo build --release -p kaplay-native-host --no-default-features --features v8
          fi
          cp "$slim" "slim-v8-host${{ matrix.exe }}"
          cargo build --release -p kaplay-native-host
          run() {
            if [ "${{ runner.os }}" = "Linux" ]; then
              xvfb-run -a "$@"
            else
              "$@"
            fi
          }
          run "target/release/kaplay-native-host${{ matrix.exe }}" \
            --script examples/smoke/main.js --dir examples/smoke \
            --window 320x240 --frames 5 --no-steam --no-audio \
            --screenshot-raw quickjs.rgba
          run "./slim-v8-host${{ matrix.exe }}" \
            --script examples/smoke/main.js --dir examples/smoke \
            --window 320x240 --frames 5 --no-steam --no-audio \
            --js-engine v8 --screenshot-raw v8.rgba
          node -e 'const fs = require("fs"); const a = fs.readFileSync("quickjs.rgba"); const b = fs.readFileSync("v8.rgba"); if (!a.equals(b)) { console.error("the quickjs and slim v8 frames differ"); process.exit(1); }'
          node scripts/check-frame.mjs v8.rgba 320 240
      - name: Publish the archive
        if: steps.check.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^name = "v8"$/{getline; print $2; exit}' Cargo.lock)
          tag=slim-v8-$version
          asset=librusty_v8_slim_${version}_${{ matrix.target }}${{ matrix.lib_ext }}
          notes=$(printf 'V8 %s without i18n, WebAssembly and Temporal, built for the kaplay-native v8 hosts.\n\nconfig=%s' "$version" "$SLIM_V8_CONFIG")
          cp "target/slim-v8/${{ matrix.lib }}" "$asset"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --title "Slim V8 $version" --notes "$notes" ||
            echo "the $tag release already exists"
          gh release upload "$tag" "$asset" --clobber
          gh release edit "$tag" --notes "$notes"
