name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev libxkbcommon-x11-0 libudev-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  rust-v8:
    name: Rust (V8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev libxkbcommon-x11-0 libudev-dev
      - run: cargo clippy -p kaplay-native-host --all-targets --no-default-features --features v8 -- -D warnings
      - run: cargo test -p kaplay-native-host --no-default-features --features v8
      - run: cargo test -p kaplay-native-host --features v8

  node:
    name: Node (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test shim/test/shim.test.js cli/test/host.test.mjs cli/test/updates.test.mjs
      - name: Pack the smoke example
        run: node cli/src/index.mjs build examples/smoke --out smoke.pak

  render-v8:
    name: Render engines (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev libxkbcommon-x11-0 libudev-dev \
            xvfb lld
      - run: cargo build --release -p kaplay-native-host --features v8
        env:
          RUSTFLAGS: -C force-unwind-tables=no -C link-arg=-fuse-ld=lld -C link-arg=-Wl,--icf=all
      - name: Smoke frames match across engines
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          xvfb-run -a target/release/kaplay-native-host \
            --script examples/smoke/main.js --dir examples/smoke \
            --window 320x240 --frames 5 --no-steam --no-audio \
            --screenshot-raw quickjs.rgba
          xvfb-run -a target/release/kaplay-native-host \
            --script examples/smoke/main.js --dir examples/smoke \
            --window 320x240 --frames 5 --no-steam --no-audio \
            --js-engine v8 --screenshot-raw v8.rgba
          cmp quickjs.rgba v8.rgba
          node scripts/check-frame.mjs v8.rgba 320 240
      - name: Module imports match across engines
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          xvfb-run -a target/release/kaplay-native-host \
            --dir examples/modules --window 320x240 --frames 1 --no-steam --no-audio \
            2>&1 | grep -o 'MODULE .*' > modules-quickjs.log
          xvfb-run -a target/release/kaplay-native-host \
            --dir examples/modules --window 320x240 --frames 1 --no-steam --no-audio \
            --js-engine v8 2>&1 | grep -o 'MODULE .*' > modules-v8.log
          test -s modules-v8.log
          diff modules-quickjs.log modules-v8.log
      - name: Video playback matches across engines
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          xvfb-run -a target/release/kaplay-native-host \
            --dir examples/video --window 320x240 --frames 40 --no-steam --no-audio \
            2>&1 | grep -o 'VIDEO .*' > video-quickjs.log
          xvfb-run -a target/release/kaplay-native-host \
            --dir examples/video --window 320x240 --frames 40 --no-steam --no-audio \
            --js-engine v8 2>&1 | grep -o 'VIDEO .*' > video-v8.log
          grep -q 'VIDEO META 160 120 1' video-v8.log
          grep -q 'VIDEO FRAME 0.5 ' video-v8.log
          diff video-quickjs.log video-v8.log
      - name: Bridge parity across engines
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          xvfb-run -a target/release/kaplay-native-host \
            --script examples/bridge/main.js --dir examples/bridge \
            --window 320x240 --frames 1 --no-steam --no-audio \
            --save-dir bridge-quickjs 2>&1 | grep -o 'BRIDGE .*' > quickjs.log
          xvfb-run -a target/release/kaplay-native-host \
            --script examples/bridge/main.js --dir examples/bridge \
            --window 320x240 --frames 1 --no-steam --no-audio \
            --save-dir bridge-v8 --js-engine v8 2>&1 | grep -o 'BRIDGE .*' > v8.log
          diff quickjs.log v8.log
      - name: Pack a game into a single executable
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          node cli/src/index.mjs pack examples/bridge --host target/release/kaplay-native-host --out packed-game
          xvfb-run -a ./packed-game --frames 1 --no-steam --no-audio > packed-run.log 2>&1 || { cat packed-run.log; exit 1; }
          grep -o 'BRIDGE .*' packed-run.log > packed.log
          test -s packed.log

  render:
    name: Render (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev libxkbcommon-x11-0 libudev-dev \
            xvfb lld
      - run: cargo build --release -p kaplay-native-host
        env:
          RUSTFLAGS: ${{ runner.os == 'Linux' && '-C force-unwind-tables=no -C link-arg=-fuse-ld=lld -C link-arg=-Wl,--icf=all' || '' }}
      - name: Install the Mesa software renderer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z -OutFile mesa.7z
          7z x mesa.7z -omesa
          Copy-Item mesa/x64/*.dll target/release/
      - name: Render five frames (Linux)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a target/release/kaplay-native-host \
            --script examples/smoke/main.js --dir examples/smoke \
            --window 320x240 --frames 5 --no-steam --no-audio \
            --screenshot smoke.png --screenshot-raw smoke.rgba
      - name: Render five frames (macOS)
        if: runner.os == 'macOS'
        run: |
          target/release/kaplay-native-host \
            --script examples/smoke/main.js --dir examples/smoke \
            --window 320x240 --frames 5 --no-steam --no-audio \
            --screenshot smoke.png --screenshot-raw smoke.rgba
      - name: Render five frames (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          target/release/kaplay-native-host --script examples/smoke/main.js --dir examples/smoke --window 320x240 --frames 5 --no-steam --no-audio --screenshot smoke.png --screenshot-raw smoke.rgba
      - name: Check the screenshot
        shell: bash
        run: |
          test -s smoke.png
          node scripts/check-frame.mjs smoke.rgba 320 240
      - name: Upload the host (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: kaplay-native-host-linux-x86_64
          path: target/release/kaplay-native-host
      - name: Upload the host (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: kaplay-native-host-macos-aarch64
          path: target/release/kaplay-native-host
      - name: Upload the host (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: kaplay-native-host-windows-x86_64
          path: target/release/kaplay-native-host.exe
